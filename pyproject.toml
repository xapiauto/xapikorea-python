[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xapikorea"
version = "0.1.0"
description = "Official Python SDK for the XAPI Korea API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "XAPI Korea" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xapikorea"]
