[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xapikorea"
dynamic = ["version"]
description = "Official Python SDK for the XAPI Korea API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "XAPI Korea" },
]
keywords = ["automotive", "korea", "sdk", "vehicles", "xapi-korea"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://xapikorea.com"
Documentation = "https://github.com/xapiauto/xapikorea-python#readme"
Issues = "https://github.com/xapiauto/xapikorea-python/issues"
Repository = "https://github.com/xapiauto/xapikorea-python"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "twine>=7,<8",
]

[tool.hatch.version]
path = "src/xapikorea/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xapikorea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
